# cloudbuild.yaml
#
# Cloud Build pipeline — weights never touch GitHub or the local machine:
#   GitHub (code only) + GCS (weights) -> Cloud Build -> Artifact Registry -> Cloud Run
#
# The first step downloads ONLY the production file types (.pt/.pth/.json —
# the 19 files baked into the image per .dockerignore; .onnx exports are
# skipped on purpose). The Dockerfile then builds exactly as it does locally.
#
# Trigger: connect the GitHub repo in Cloud Build (push to main) — see
# one-time setup notes at the bottom of this file.
#
# Usage (manual run, no local build needed):
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: asia-southeast1
  _AR_REPO: lpr-repo
  _IMAGE_NAME: thai-lpr-api
  _WEIGHTS_BUCKET: lpr-weight
  _CLOUD_RUN_SERVICE: thai-lpr-api

steps:
  # ---------------------------------------------------------------
  # 1. Pull production weights straight from GCS into the workspace.
  #    The default Cloud Build service account can read same-project
  #    buckets without extra IAM setup.
  # ---------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: bash
    args:
      - -c
      - |
        mkdir -p weights
        gcloud storage cp "gs://${_WEIGHTS_BUCKET}/*.pt" \
                          "gs://${_WEIGHTS_BUCKET}/*.pth" \
                          "gs://${_WEIGHTS_BUCKET}/*.json" \
                          weights/
        echo "--- weights/ contents ---"
        ls -lh weights/

  # ---------------------------------------------------------------
  # 2. Build the image (Dockerfile remains the image definition).
  #    Tagged with both the commit SHA (immutable) and :latest.
  # ---------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest
      - .

  # ---------------------------------------------------------------
  # 3. Push to Artifact Registry.
  # ---------------------------------------------------------------
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest

  # ---------------------------------------------------------------
  # 4. Deploy to Cloud Run (matches GPC_Powershell.txt settings).
  # ---------------------------------------------------------------
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_CLOUD_RUN_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --cpu=2
      - --memory=2Gi
      - --concurrency=8
      - --timeout=60s
      - --min-instances=0
      - --max-instances=1
      - --cpu-throttling
      - --port=8080

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

# ============================================================================
# ONE-TIME GCP SETUP (console or gcloud, ~5 minutes):
#
# 1. Enable Cloud Build API:
#      gcloud services enable cloudbuild.googleapis.com
#
# 2. Connect GitHub: Cloud Console -> Cloud Build -> Repositories ->
#    "Connect repository" (installs the Cloud Build GitHub App, picks the repo).
#
# 3. Grant the Cloud Build SA permission to push to Artifact Registry:
#      gcloud artifacts repositories add-iam-policy-binding lpr-repo \
#        --location=asia-southeast1 \
#        --member="serviceAccount:$(gcloud projects describe lpr-car-plate \
#          --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role=roles/artifactregistry.writer
#
# 4. Grant the Cloud Build SA permission to deploy to Cloud Run (the deploy
#    step in step 4 of the pipeline needs this):
#      gcloud projects add-iam-policy-binding lpr-car-plate \
#        --member="serviceAccount:$(gcloud projects describe lpr-car-plate \
#          --format='value(projectNumber)')@cloudbuild.gserviceaccount.com" \
#        --role=roles/run.admin
#      (repeat with --role=roles/iam.serviceAccountUser)
#
# 4. Create the trigger: Cloud Build -> Triggers -> Create
#      Event: Push to branch "main"
#      Config: Cloud Build configuration file (cloudbuild.yaml)
#
# After this: every `git push` builds + deploys automatically. No local gcloud,
# no weights in GitHub, no SA keys in GitHub Secrets.
# ============================================================================
